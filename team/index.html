<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track Info</title>
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EEF0F2">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../log-view.css">
<script src="../log-view.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a toolbar (race, day, live status), then the day sheet styled after the team's Excel tabs, then the graphs. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#0B0D0F; --muted:#3E454C; --line:#AEB6BD; --grid:#E3E6E9; --axis:#9AA2A9;
  --note:#FFD43B; --note-ink:#1A1C1E; --good:#1E7F4E; --warn:#B4500A; --bad:#B42318;
  /* sheet colors, matched to the Excel day tabs */
  --wx-h:#BFBFBF; --wx:#E9E9E9; --sl-h:#F4B4B4; --sl:#FCE1E1; --t10-h:#D0CECE; --t10:#EDEDED;
  --tk-h:#D9D9D9; --tk:#F4F4F4; --bl-h:#9DC3E6; --bl:#DDEBF7; --nate:#BDD7EE; --hdr-blue:#2F75B5; --hdr-red:#E00000;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) calc(32px + env(safe-area-inset-bottom,0)) max(16px,env(safe-area-inset-left,0))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--note);outline-offset:2px}
[hidden]{display:none!important}
.label{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1500px;margin:0 auto}

/* login */
.login{min-height:80vh;display:grid;place-items:center}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font:700 34px/1 var(--display)}
.login p{margin:0;color:var(--muted)}
.login input{min-height:52px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:18px;background:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font:700 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;min-height:44px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.err{color:var(--bad);min-height:20px;font-size:14px}

/* toolbar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 8px}
.top h1{margin:0;font:700 30px/1 var(--display);flex:1 0 auto;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--axis)}
.live.on i{background:#1E9E55;box-shadow:0 0 0 3px rgba(30,158,85,.18)}
.who{font-size:13px;color:var(--muted)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;font:700 17px/1 var(--display);min-width:0;max-width:100%}
.days{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font:700 15px/1 var(--display);letter-spacing:.04em;min-height:40px}
.chip[aria-pressed="true"]{background:var(--note);border-color:var(--note);color:var(--note-ink)}
.spacer{flex:1}

/* the day sheet */
.sheet-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.sheet-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:700 26px/1 var(--display)}
.sheet-head .d{font:600 20px/1 var(--display);color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13.5px}
th,td{border:1px solid #8E969D;padding:4px 5px;text-align:center;white-space:nowrap}
thead th{font:700 14px/1.15 var(--display);letter-spacing:.02em;position:sticky;top:0}
thead tr.g th{font-size:15px}
td.notes{text-align:left;white-space:normal;min-width:170px;max-width:340px}
th.c-time,td.c-time{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 #8E969D}
thead th.c-time{z-index:2}
.g-info{background:#fff}
.g-wx{background:var(--wx)} th.g-wx{background:var(--wx-h)}
.g-sl{background:var(--sl)} th.g-sl{background:var(--sl-h)}
.g-t10{background:var(--t10)} th.g-t10{background:var(--t10-h)}
.g-tk{background:var(--tk)} th.g-tk{background:var(--tk-h)}
.g-bl{background:var(--bl)} th.g-bl{background:var(--bl-h)}
td.k-nate{background:var(--nate)}
.g-stk,.g-notes{background:#fff}
th.h-blue{color:var(--hdr-blue)} th.h-red{color:var(--hdr-red)}
/* the sheet's conditional formatting */
td.car-austin{background:#0032FF;color:#D9D9D9}
td.car-pm{background:#92D050}
td.car-matt{background:#CDEBF8}
td.car-scrape{background:#F6C6AD}
td.car-spray{background:#FFFF99}
td.car-prep{background:#FFC000}
td.car-delay{color:#E00000}
td.lane-r{color:#E00000;font-weight:700}
td.lane-l{font-weight:700}
tr.run td.c-time{font-weight:700}
tr.fresh td{animation:fresh 4s ease-out}
@keyframes fresh{0%{box-shadow:inset 0 0 0 999px rgba(255,212,59,.55)}100%{box-shadow:inset 0 0 0 999px rgba(255,212,59,0)}}
tr.pending td.c-time::after{content:" ⟳";color:var(--warn)}
.empty{padding:28px 14px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);font:700 20px/1.2 var(--display);margin-bottom:4px}

/* graphs */
.g-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 8px}
.g-title h2{margin:0;font:700 24px/1 var(--display)}
.g-key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.g-key b{color:var(--ink)}
.g-sw{display:inline-block;width:0;height:14px;border-left:2px solid var(--ink);margin-right:6px;vertical-align:-2px}
.g-sw.dash{border-left-style:dashed;opacity:.7}
.g-readout{position:sticky;top:env(safe-area-inset-top,0);z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;min-height:54px}
.g-readout .t{font:700 17px/1.1 var(--display)}
.g-readout .vals{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;margin-top:3px}
.g-readout .vals span{white-space:nowrap}
.g-readout i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:12px}
.g-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px 4px 10px;min-width:0}
.g-ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-right:8px}
.g-ptitle h3{margin:0;font:700 17px/1.1 var(--display)}
.g-ptitle .u{color:var(--muted);font-size:12px}
.g-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin:4px 0 2px}
.g-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
.g-panel svg{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.g-panel svg text{font-family:var(--body);font-size:12.5px;fill:var(--muted)}
.g-panel svg .lbl{font-size:13px;font-weight:600;fill:var(--ink)}
.g-ptitle h3{font-size:20px!important}
.g-none{padding:14px 4px;color:var(--muted)}
/* view tabs */
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px}
.vtab{border:0;background:none;padding:10px 16px;font:700 18px/1 var(--display);letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.vtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.logwrap{max-width:900px}
.logctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0 8px}
.loghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.loghead h2{margin:0;font:700 26px/1 var(--display)} .loghead .d{font:600 20px/1 var(--display);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){tr.fresh td{animation:none}}
</style>
</head>
<body>
<div class="wrap">

<section class="login" id="login" hidden>
  <form id="loginForm">
    <h1>Track Info</h1>
    <p>Tasca Racing track readings, live from the starting line.</p>
    <label class="label" for="pw">Team password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr" aria-live="polite"></div>
    <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
  </form>
</section>

<main id="app" hidden>
  <div class="top">
    <h1>Track Info</h1>
    <span class="live" id="live"><i></i><span id="liveTxt">Connecting</span></span>
    <span class="who" id="who"></span>
    <button class="btn" type="button" id="signOut">Sign out</button>
  </div>
  <div class="bar">
    <label class="label" for="race">Race</label>
    <select id="race" aria-label="Race"></select>
    <div class="days" id="days" role="group" aria-label="Day"></div>
    <span class="spacer"></span>
    <button class="btn" type="button" id="importBtn" hidden>Import readings</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button class="btn" type="button" id="dl">Download Excel</button>
  </div>

  <div class="vtabs" role="tablist" aria-label="View">
    <button class="vtab" role="tab" data-view="log" aria-selected="true">Log</button>
    <button class="vtab" role="tab" data-view="sheet" aria-selected="false">Sheet</button>
    <button class="vtab" role="tab" data-view="graphs" aria-selected="false">Graphs</button>
  </div>

  <section id="vLog" class="logwrap tlv" aria-label="Log">
    <div class="loghead"><h2 id="logTitle">—</h2><span class="d" id="logDay"></span></div>
    <div id="rightNow"></div>
    <div class="logctl">
      <span class="label">Lane</span>
      <button class="chip" data-llane="all" aria-pressed="true">Both</button>
      <button class="chip" data-llane="L" aria-pressed="false">Left</button>
      <button class="chip" data-llane="R" aria-pressed="false">Right</button>
      <span class="spacer"></span>
      <button class="chip" id="logOrder" aria-pressed="false">Newest first</button>
    </div>
    <div id="logList"></div>
  </section>

  <section class="sheet-card" id="vSheet" hidden aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">—</h2><span class="d" id="sheetDay"></span><span class="who" id="count"></span></div>
    <div class="scroll" id="sheet"></div>
  </section>

  <section id="vGraphs" hidden aria-labelledby="gH">
    <div class="g-title">
      <h2 id="gH">Graphs</h2>
      <div class="days" role="group" aria-label="Lane" id="lanes">
        <button class="chip" data-glane="all" aria-pressed="true">Both lanes</button>
        <button class="chip" data-glane="L" aria-pressed="false">Left</button>
        <button class="chip" data-glane="R" aria-pressed="false">Right</button>
      </div>
      <div class="g-key"><span><span class="g-sw"></span><b>Scrape</b></span><span><span class="g-sw dash"></span><b>Spray</b></span></div>
    </div>
    <div class="g-readout" id="gReadout" aria-live="polite"><div class="who">Touch or hover over a chart to see the readings at that time.</div></div>
    <div class="g-grid" id="gPanels"></div>
  </section>
</main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script type="module">
import { login, logout, watchRole, watchEvents, watchEntries, raceLabel, saveMany } from "../fb.js";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has = v => v !== undefined && v !== null && String(v).trim() !== "";
let tt; const toast = m => { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); };
const DAYS = ["SUN","MON","TUE","WED","THURS","FRI","SAT"];
const dayLabel = iso => DAYS[new Date(iso + "T12:00:00").getDay()];
const prettyDate = iso => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const time12 = hm => { if (!hm) return ""; let [h, m] = hm.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`; };
const notesText = e => [has(e.notes) ? e.notes.trim() : "", (has(e.et) || has(e.mph)) ? [e.et, has(e.mph) ? e.mph + "mph" : ""].filter(has).join(", ") : ""].filter(Boolean).join(" / ");
const cellValue = (e, k) => k === "time" ? time12(e.time) : k === "car" ? (e.type === "work" ? e.work : e.car)
  : k === "notes" ? notesText(e) : k === "slStk" ? (has(e.slSticky) ? e.slSticky : e.slGrade) : e[k];

/* ---------- sign-in ---------- */
let role = null, events = [], entries = [], curEvent = null, curDate = null, unsubEvents = null, unsubEntries = null, seen = new Set(), firstLoad = true;
watchRole(r => {
  role = r;
  $("login").hidden = !!r; $("app").hidden = !r;
  $("importBtn").hidden = r !== "edit";
  if (r) { $("who").textContent = r === "edit" ? "Signed in · Editor" : "Signed in · Viewer"; startEvents(); }
  else { unsubEvents && unsubEvents(); unsubEntries && unsubEntries(); unsubEvents = unsubEntries = null; }
});
$("loginForm").addEventListener("submit", async ev => {
  ev.preventDefault(); $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  try { await login($("pw").value); $("pw").value = ""; }
  catch (e) { $("loginErr").textContent = e.code === "bad-password" ? "That password didn't match. Check it and try again." : "Couldn't reach the server. Check your connection and try again."; }
  $("loginBtn").disabled = false;
});
$("signOut").onclick = () => logout();

/* ---------- races and days ---------- */
function startEvents() {
  if (unsubEvents) return;
  unsubEvents = watchEvents((list, meta) => {
    events = list;
    setLive(!meta.fromCache);
    const wanted = (location.hash.slice(1) || "").split(".")[0];
    if (!curEvent || !events.some(e => e.id === curEvent)) curEvent = (events.find(e => e.id === wanted) || events[0] || {}).id || null;
    renderRaces(); openEvent(curEvent);
  }, err => { setLive(false, "Can't load races"); console.error(err); });
}
function setLive(on, txt) { $("live").classList.toggle("on", on); $("liveTxt").textContent = txt || (on ? "Live" : "Offline"); }
function renderRaces() {
  $("race").innerHTML = events.length ? events.map(e => `<option value="${esc(e.id)}"${e.id === curEvent ? " selected" : ""}>${esc(raceLabel(e.track || e.id, e.dates))}</option>`).join("")
    : `<option>No races yet</option>`;
  $("race").disabled = !events.length;
}
$("race").onchange = () => { curEvent = $("race").value; curDate = null; openEvent(curEvent); };
function openEvent(id) {
  if (openEvent.id === id) { renderAll(); return; }
  openEvent.id = id; unsubEntries && unsubEntries(); unsubEntries = null; entries = []; seen = new Set(); firstLoad = true;
  if (!id) { renderAll(); return; }
  unsubEntries = watchEntries(id, (list, meta) => {
    const fresh = firstLoad ? new Set() : new Set(list.filter(e => !seen.has(e.id)).map(e => e.id));
    list.forEach(e => seen.add(e.id)); firstLoad = false;
    entries = list; renderAll(fresh);
    setLive(!meta.fromCache);
  }, err => { setLive(false, "Can't load readings"); console.error(err); });
}
function eventDates() {
  const ev = events.find(e => e.id === curEvent) || {};
  return [...new Set([...(ev.dates || []), ...entries.map(e => e.date)])].filter(Boolean).sort();
}
function renderAll(fresh = new Set()) {
  const dates = eventDates();
  if (!curDate || !dates.includes(curDate)) {
    const want = (location.hash.slice(1) || "").split(".")[1];
    curDate = dates.includes(want) ? want : dates[dates.length - 1] || null;
  }
  $("days").innerHTML = dates.map(d => `<button class="chip" data-date="${d}" aria-pressed="${d === curDate}">${dayLabel(d)} ${+d.slice(8)}</button>`).join("");
  renderSheet(fresh); renderLog(); if (view === "graphs") buildGraphs();
  if (curEvent) history.replaceState(null, "", "#" + curEvent + (curDate ? "." + curDate : ""));
}
$("days").onclick = e => { const b = e.target.closest("[data-date]"); if (b) { curDate = b.dataset.date; renderAll(); } };
const dayEntries = () => entries.filter(e => e.date === curDate).sort((a, b) => (a.time || "").localeCompare(b.time || ""));

/* ---------- log view (Right now + race-day log) ---------- */
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
let view = (() => { try { return localStorage.getItem("ti.view") || "log"; } catch (_) { return "log"; } })();
let logLane = "all", newestFirst = true;
function renderLog() {
  const ev = events.find(e => e.id === curEvent), rows = curDate ? dayEntries() : [];
  $("logTitle").textContent = ev ? ev.track : "No races yet"; $("logDay").textContent = curDate ? prettyDate(curDate) : "";
  const today = curDate === todayISO(), d = new Date();
  $("rightNow").innerHTML = ev ? TLV.rightNow(rows, { now: d.getHours() * 60 + d.getMinutes(), today }) : "";
  $("logList").innerHTML = ev ? TLV.log(rows, { lane: logLane, newestFirst }) : `<div class="tlv-empty">Readings saved in Track Log Live show up here as soon as they're entered.</div>`;
}
function showView(v) {
  view = v; try { localStorage.setItem("ti.view", v); } catch (_) {}
  document.querySelectorAll(".vtab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v ? "true" : "false"));
  $("vLog").hidden = v !== "log"; $("vSheet").hidden = v !== "sheet"; $("vGraphs").hidden = v !== "graphs";
  if (v === "graphs") buildGraphs();
}
document.querySelector(".vtabs").addEventListener("click", e => { const t = e.target.closest("[data-view]"); if (t) showView(t.dataset.view); });
document.querySelector(".logctl").addEventListener("click", e => {
  const b = e.target.closest("[data-llane]");
  if (b) { logLane = b.dataset.llane; document.querySelectorAll("[data-llane]").forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false")); renderLog(); }
});
$("logOrder").onclick = () => { newestFirst = !newestFirst; $("logOrder").textContent = newestFirst ? "Newest first" : "Oldest first"; renderLog(); };
setInterval(() => { if (view === "log" && curDate === todayISO()) renderLog(); }, 30000);   // keeps "minutes ago" current
setTimeout(() => showView(view));   // after the graph code below has loaded

/* ---------- the day sheet (same columns as the Excel day tabs) ---------- */
const COLS = [
  { k: "time", h: "Time", g: "info", cls: "c-time" }, { k: "run", h: "Run", g: "info" }, { k: "lane", h: "Lane", g: "info" }, { k: "car", h: "Car", g: "info" },
  { k: "uv", h: "UV", g: "wx", hc: "h-blue" }, { k: "solar", h: "Solar", g: "wx", hc: "h-blue" }, { k: "cc", h: "CC", g: "wx", hc: "h-blue" }, { k: "air", h: "Air", g: "wx" }, { k: "track", h: "TRACK", g: "wx", hc: "h-red" },
  { k: "slLoc", h: "Location", g: "sl" }, { k: "slKeg", h: "KEG", g: "sl" }, { k: "slStk", h: "Sticky", g: "sl" },
  { k: "k10", h: "KEG", g: "t10" }, { k: "push", h: "Push", g: "t10" },
  { k: "k60", h: "KEG", g: "tk" }, { k: "k80", h: "KEG", g: "tk" },
  { k: "k125", h: "KEG", g: "bl" }, { k: "g125", h: "Etc.", g: "bl" },
  { k: "sticky", h: null, g: "stk" },
  { k: "k330", h: "KEG", g: "bl" }, { k: "g330", h: "Etc.", g: "bl" }, { k: "nate", h: "Nate", g: "bl", cls: "k-nate" },
  { k: "notes", h: null, g: "notes", cls: "notes" },
];
const GROUPS = [["Car/ Event INFO", "info", 4], ["Weather", "wx", 5], ["Starting Line", "sl", 3], ["10ft", "t10", 2], ["60ft", "tk", 1], ["80ft", "tk", 1],
  ["125ft", "bl", 2], ["Sticky", "stk", 1, true], ["330ft", "bl", 3], ["Notes", "notes", 1, true]];
function carClass(v) { const s = String(v || "").toLowerCase();

const G_PANELS = [

function gHover(m) {

$("dl").onclick = () => {
